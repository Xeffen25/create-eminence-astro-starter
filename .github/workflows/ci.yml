name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@lts
          cache: true
      - run: pnpm build
      - run: pnpm test
      - run: pnpm format:check
